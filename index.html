<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Voice Text Reader</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/reader.css" />
</head>
<body data-screen="idle">

  <!-- Welcome modal — shown on load, dismissed on first tap -->
  <div id="welcome-modal" class="welcome-modal" role="dialog" aria-modal="true" aria-label="Welcome">
    <div class="welcome-card">
      <div class="welcome-logo">Chinenye</div>
      <p class="welcome-tagline">Your voice-powered document reader</p>
      <p class="welcome-hint">Tap below to begin</p>
      <button id="welcome-tap" class="welcome-tap-btn" aria-label="Tap to begin">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        Tap here to begin
      </button>
    </div>
  </div>

  <canvas id="edge-glow-canvas" class="edge-glow-canvas" aria-hidden="true"></canvas>
  <div class="brand-logo">Chinenye</div>
  <video id="camera-video" playsinline muted tabindex="-1" class="camera-video"></video>
  <div class="camera-scrim" aria-hidden="true"></div>
  <canvas id="scan-overlay" class="scan-overlay" aria-hidden="true"></canvas>
  <div id="capture-flash" class="capture-flash" aria-hidden="true"></div>

  <input type="file" id="upload-input"
    accept="image/*,.pdf,application/pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    aria-hidden="true" tabindex="-1" style="display:none">

  <button id="idle-screen" class="screen screen--idle tap-target"
    aria-label="Tap anywhere to begin scanning a document with the camera">
    <span class="tap-ripple" aria-hidden="true"><span></span><span></span><span></span></span>
    <span class="onboarding-hand" aria-hidden="true">
      <img src="assets/onboarding-hand.png" width="145" height="122" alt="" />
    </span>
  </button>

  <button id="btn-upload" class="btn-upload" aria-label="Upload a document to read aloud">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <span>Upload</span>
  </button>

  <div id="active-screen" class="screen screen--active">
    <canvas id="waveform" class="waveform-canvas"></canvas>
    <button id="btn-cancel" class="btn-cancel" aria-label="Cancel and return to start screen">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M5 5l14 14M19 5L5 19"/>
      </svg>
    </button>
    <button id="btn-menu" class="btn-menu" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/>
      </svg>
    </button>
    <div id="menu-dropdown" class="menu-dropdown" role="menu" hidden>
      <p role="menuitem">Congrats! You found the menu… which means you don't need this app. 😄</p>
    </div>
    <div id="capture-wrap" class="capture-wrap" hidden>
      <button id="btn-capture" class="btn-capture" aria-label="Capture document now">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/>
          <path d="M2 7h2.5l1.5-3h8l1.5 3H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/>
        </svg>
      </button>
      <span class="capture-hint">Tap to capture</span>
    </div>
    <button id="btn-mic-pill" class="mic-pill" aria-label="Stop and return to start screen">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
  </div>

  <!-- Countdown overlay — shown during scanning, counts 5→0 then auto-captures -->
  <div id="scan-countdown" class="scan-countdown" aria-hidden="true" hidden>
    <div class="countdown-circle">
      <svg class="countdown-svg" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="countdown-track" cx="50" cy="50" r="44"/>
        <circle class="countdown-ring" cx="50" cy="50" r="44"/>
      </svg>
      <span class="countdown-number" id="countdown-number">5</span>
    </div>
    <span class="countdown-label">Capturing in…</span>
  </div>

  <canvas id="capture-canvas" tabindex="-1" class="capture-canvas"></canvas>
  <div id="status-polite"    aria-live="polite"    class="visually-hidden"></div>
  <div id="status-assertive" aria-live="assertive" class="visually-hidden"></div>

  <!-- Document reader modal — appears when a file is uploaded, hidden otherwise -->
  <div id="rdr-overlay" class="rdr-overlay" hidden>
   <div class="rdr-modal">
    <div class="rdr-header">
      <button id="rdr-back" class="rdr-back" aria-label="Close reader and go back">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </button>
      <span id="rdr-title" class="rdr-title">Document</span>
      <select id="rdr-jump" class="rdr-jump" aria-label="Jump to paragraph">
        <option value="">Jump to…</option>
      </select>
    </div>

    <div id="rdr-text" class="rdr-text" role="document" tabindex="0"></div>

    <div class="rdr-controls">
      <button id="rdr-stop" class="rdr-ctl rdr-ctl-stop" aria-label="Stop and reset">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <rect x="4" y="4" width="16" height="16" rx="2"/>
        </svg>
      </button>
      <button id="rdr-playpause" class="rdr-ctl rdr-ctl-play" aria-label="Pause">
        <svg class="i-pause" viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
          <rect x="6" y="4" width="4" height="16" rx="1"/>
          <rect x="14" y="4" width="4" height="16" rx="1"/>
        </svg>
        <svg class="i-play" viewBox="0 0 24 24" width="26" height="26" fill="currentColor" style="display:none">
          <path d="M5 3l14 9-14 9V3z"/>
        </svg>
      </button>
      <select id="rdr-speed" class="rdr-speed" aria-label="Reading speed">
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
    </div>
   </div><!-- /.rdr-modal -->
  </div><!-- /#rdr-overlay -->

  <script type="module" src="js/app.js"></script>
</body>
</html>
